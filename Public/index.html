<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open-Meteo Weather Layers Map</title>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />
    <style>
        :root {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color-scheme: light dark;
        }
        body {
            margin: 0;
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100vh;
        }
        .toolbar {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #c9c9c9;
            background: color-mix(in oklab, canvas 92%, #3b82f6 8%);
            flex-wrap: wrap;
        }
        .toolbar button {
            border: 1px solid #7d7d7d;
            background: canvas;
            color: canvastext;
            border-radius: 0.5rem;
            padding: 0.4rem 0.7rem;
            cursor: pointer;
        }
        .toolbar button.active {
            background: #3b82f6;
            color: #fff;
            border-color: #2563eb;
        }
        #status {
            font-size: 0.92rem;
            opacity: 0.9;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        .legend {
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            font-size: 0.85rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <strong>Open-Meteo API map layers</strong>
        <button data-layer="temperature" class="active">Temperature</button>
        <button data-layer="wind">Wind speed</button>
        <button data-layer="precipitation">Precipitation</button>
        <button id="refresh">Refresh view</button>
        <span id="status">Move or zoom map, then refresh.</span>
    </div>
    <div id="map"></div>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script>
        const map = L.map("map").setView([39.5, -98.35], 4);
        const status = document.getElementById("status");
        const layerButtons = [...document.querySelectorAll("[data-layer]")];
        const refreshButton = document.getElementById("refresh");
        let selectedLayer = "temperature";
        let dataLayer = L.layerGroup().addTo(map);
        let requestCounter = 0;

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 10,
            attribution: "&copy; OpenStreetMap contributors",
        }).addTo(map);

        const legend = L.control({ position: "bottomright" });
        legend.onAdd = () => {
            const div = L.DomUtil.create("div", "legend");
            div.id = "legend";
            div.textContent = "Layer: temperature (°C)";
            return div;
        };
        legend.addTo(map);

        function gridPoints(bounds, steps = 4) {
            const points = [];
            const latStep = (bounds.getNorth() - bounds.getSouth()) / steps;
            const lonStep = (bounds.getEast() - bounds.getWest()) / steps;
            for (let y = 0; y <= steps; y++) {
                for (let x = 0; x <= steps; x++) {
                    points.push([
                        bounds.getSouth() + y * latStep,
                        bounds.getWest() + x * lonStep
                    ]);
                }
            }
            return points;
        }

        function colorForValue(layer, value) {
            if (layer === "temperature") {
                if (value <= 0) return "#2563eb";
                if (value <= 10) return "#38bdf8";
                if (value <= 20) return "#22c55e";
                if (value <= 30) return "#f59e0b";
                return "#ef4444";
            }
            if (layer === "wind") {
                if (value <= 10) return "#22c55e";
                if (value <= 25) return "#f59e0b";
                return "#ef4444";
            }
            if (value <= 0.2) return "#60a5fa";
            if (value <= 2) return "#2563eb";
            return "#1e3a8a";
        }

        function valueLabel(layer, data) {
            if (layer === "temperature") return `${data.temperature_2m.toFixed(1)} °C`;
            if (layer === "wind") return `${data.wind_speed_10m.toFixed(1)} km/h`;
            return `${data.precipitation.toFixed(1)} mm`;
        }

        function updateLegend() {
            const legendDiv = document.getElementById("legend");
            const units = selectedLayer === "temperature"
                ? "°C"
                : selectedLayer === "wind"
                    ? "km/h"
                    : "mm";
            legendDiv.textContent = `Layer: ${selectedLayer} (${units})`;
        }

        async function fetchCurrentWeather(lat, lon) {
            const params = new URLSearchParams({
                latitude: lat.toFixed(3),
                longitude: lon.toFixed(3),
                current: "temperature_2m,precipitation,wind_speed_10m",
                timezone: "auto"
            });
            const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            const json = await response.json();
            return json.current;
        }

        async function refreshLayer() {
            const thisRequest = ++requestCounter;
            status.textContent = "Loading weather layers from Open-Meteo API...";
            dataLayer.clearLayers();
            updateLegend();

            const points = gridPoints(map.getBounds(), 4);
            const requests = points.map(async ([lat, lon]) => {
                const current = await fetchCurrentWeather(lat, lon);
                return { lat, lon, current };
            });

            try {
                const results = await Promise.all(requests);
                if (thisRequest !== requestCounter) return;

                for (const { lat, lon, current } of results) {
                    const value = selectedLayer === "temperature"
                        ? current.temperature_2m
                        : selectedLayer === "wind"
                            ? current.wind_speed_10m
                            : current.precipitation;
                    const marker = L.circleMarker([lat, lon], {
                        radius: 8,
                        fillColor: colorForValue(selectedLayer, value),
                        fillOpacity: 0.75,
                        weight: 1,
                        color: "#111"
                    });
                    marker.bindTooltip(
                        `${lat.toFixed(2)}, ${lon.toFixed(2)}<br>${valueLabel(selectedLayer, current)}`,
                        { direction: "top" }
                    );
                    marker.addTo(dataLayer);
                }
                status.textContent = `Loaded ${results.length} points for ${selectedLayer}.`;
            } catch (error) {
                if (thisRequest !== requestCounter) return;
                status.textContent = `Unable to load weather data: ${error.message}`;
            }
        }

        layerButtons.forEach((button) => {
            button.addEventListener("click", () => {
                selectedLayer = button.dataset.layer;
                layerButtons.forEach((candidate) => candidate.classList.remove("active"));
                button.classList.add("active");
                refreshLayer();
            });
        });

        refreshButton.addEventListener("click", refreshLayer);
        map.on("moveend", () => {
            status.textContent = "Map moved. Click refresh to reload layer data for the new area.";
        });

        refreshLayer();
    </script>
</body>
</html>
